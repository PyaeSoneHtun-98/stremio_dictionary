name: Release Windows

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release-windows:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: windows-latest

    steps:
      - name: Checkout exact CI head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must be a stable x.y.z version before release. Found: $version"
          }

          $tag = "v$version"
          $notesPath = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }

          & gh release view $tag --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $tag already exists; nothing to publish."
            exit 0
          }
          $global:LASTEXITCODE = 0

          & git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists without a GitHub Release. Refusing to publish automatically."
          }
          $global:LASTEXITCODE = 0

          $head = (& git rev-parse HEAD).Trim()
          if (-not $head.Equals($env:RELEASE_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Checked-out commit $head does not match successful CI head $env:RELEASE_SHA."
          }

          "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci

      - name: Revalidate exact release source
        if: steps.release.outputs.should_release == 'true'
        run: npm run check

      - name: Build Windows release artifacts
        if: steps.release.outputs.should_release == 'true'
        run: npm run package:win

      - name: Verify release version and checksums
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $expectedVersion = '${{ steps.release.outputs.version }}'
          $buildInfo = Get-Content -LiteralPath 'release\SubtitleBridge-win-x64\BUILD_INFO.json' -Raw | ConvertFrom-Json
          if ([string]$buildInfo.version -ne $expectedVersion) {
            throw "Packaged version $($buildInfo.version) does not match release version $expectedVersion."
          }

          foreach ($file in @(
            'release\SubtitleBridge-Setup-x64.exe',
            'release\SubtitleBridge-win-x64.zip'
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release artifact: $file"
            }

            $checksumFile = "$file.sha256"
            if (-not (Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
              throw "Missing checksum file: $checksumFile"
            }

            $expectedHash = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch for $file."
            }
          }

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $notesPath = '${{ steps.release.outputs.notes_path }}'

          gh release create $tag `
            'release\SubtitleBridge-Setup-x64.exe' `
            'release\SubtitleBridge-Setup-x64.exe.sha256' `
            'release\SubtitleBridge-win-x64.zip' `
            'release\SubtitleBridge-win-x64.zip.sha256' `
            --repo $env:REPOSITORY `
            --target $env:RELEASE_SHA `
            --title "Subtitle Bridge v$version" `
            --notes-file $notesPath
