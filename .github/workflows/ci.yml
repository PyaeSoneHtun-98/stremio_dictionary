name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

  package-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows MVP
        run: npm run package:win

      - name: Verify packaged install, upgrade, and Stremio handoff
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'release\SubtitleBridge-win-x64'
          $installDir = Join-Path $env:RUNNER_TEMP 'SubtitleBridgeInstall'
          $installer = Join-Path $packageDir 'Install-SubtitleBridge.ps1'

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -InstallDir $installDir -NoShortcut -NoLaunch
          if ($LASTEXITCODE -ne 0) {
            throw 'Initial installer run failed.'
          }

          $required = @(
            (Join-Path $installDir 'Subtitle Bridge.exe'),
            (Join-Path $installDir 'Enable-StremioHandoff.ps1'),
            (Join-Path $installDir 'Disable-StremioHandoff.ps1'),
            (Join-Path $installDir 'resources\app\package.json'),
            (Join-Path $installDir 'resources\app\out\main\index.js'),
            (Join-Path $installDir 'resources\app\out\preload\index.js'),
            (Join-Path $installDir 'resources\app\out\renderer\index.html'),
            (Join-Path $packageDir 'RUNTIME_DEPENDENCIES.txt'),
            (Join-Path $PWD 'release\SubtitleBridge-win-x64.zip'),
            (Join-Path $PWD 'release\SubtitleBridge-win-x64.zip.sha256')
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaged artifact: $path"
            }
          }

          $buildInfo = Get-Content -LiteralPath (Join-Path $packageDir 'BUILD_INFO.json') -Raw | ConvertFrom-Json
          if ($buildInfo.arch -ne 'x64') {
            throw "Unexpected package architecture: $($buildInfo.arch)"
          }
          if ($buildInfo.runtimeDependencies.mpv.bundled -or $buildInfo.runtimeDependencies.ffmpeg.bundled) {
            throw 'Release artifacts must not redistribute mpv or FFmpeg binaries.'
          }

          $unexpectedBundledTools = @(
            (Join-Path $packageDir 'resources\tools\mpv\mpv.exe'),
            (Join-Path $packageDir 'resources\tools\ffmpeg\ffmpeg.exe')
          )
          foreach ($path in $unexpectedBundledTools) {
            if (Test-Path -LiteralPath $path) {
              throw "Unexpected bundled third-party runtime: $path"
            }
          }

          $staleSentinel = Join-Path $installDir 'obsolete-from-previous-install.txt'
          Set-Content -LiteralPath $staleSentinel -Value 'stale'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -InstallDir $installDir -NoShortcut -NoLaunch
          if ($LASTEXITCODE -ne 0) {
            throw 'Upgrade installer run failed.'
          }
          if (Test-Path -LiteralPath $staleSentinel) {
            throw 'Upgrade retained a stale file from the previous installation.'
          }

          $rollbackMarker = Join-Path $installDir 'existing-install.marker'
          Set-Content -LiteralPath $rollbackMarker -Value 'keep-me'
          $brokenPackageDir = Join-Path $env:RUNNER_TEMP 'SubtitleBridgeBrokenPackage'
          Copy-Item -LiteralPath $packageDir -Destination $brokenPackageDir -Recurse
          Remove-Item -LiteralPath (Join-Path $brokenPackageDir 'resources\app\out\renderer\index.html') -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $brokenPackageDir 'Install-SubtitleBridge.ps1') -InstallDir $installDir -NoShortcut -NoLaunch
          $brokenExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($brokenExitCode -eq 0) {
            throw 'Installer accepted an incomplete staged package.'
          }
          if (-not (Test-Path -LiteralPath $rollbackMarker)) {
            throw 'Failed upgrade modified the existing installation.'
          }

          $nestedInstallDir = Join-Path $packageDir 'nested-install-should-fail'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -InstallDir $nestedInstallDir -NoShortcut -NoLaunch
          $nestedExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($nestedExitCode -eq 0) {
            throw 'Installer accepted a destination nested inside the source package.'
          }

          $vlcKey = 'HKCU:\Software\Classes\vlc'
          $vlcCommandKey = Join-Path $vlcKey 'shell\open\command'
          $handoffBackupDir = Join-Path $env:LOCALAPPDATA 'Subtitle Bridge\stremio-handoff'
          $handoffBackupPath = Join-Path $handoffBackupDir 'vlc-protocol-before-subtitle-bridge.reg'
          Remove-Item -LiteralPath $vlcKey -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $handoffBackupDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path $vlcCommandKey -Force | Out-Null
          Set-Item -LiteralPath $vlcKey -Value 'URL:CI VLC handler'
          New-ItemProperty -LiteralPath $vlcKey -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
          Set-Item -LiteralPath $vlcCommandKey -Value '"C:\CI\vlc.exe" "%1"'

          $enableHandoff = Join-Path $installDir 'Enable-StremioHandoff.ps1'
          $disableHandoff = Join-Path $installDir 'Disable-StremioHandoff.ps1'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $enableHandoff -ExecutablePath (Join-Path $installDir 'Subtitle Bridge.exe')
          if ($LASTEXITCODE -ne 0) {
            throw 'Stremio handoff enable helper failed.'
          }
          $enabled = Get-ItemProperty -LiteralPath $vlcKey
          if ($enabled.SubtitleBridgeCompatibility -ne '1') {
            throw 'Stremio handoff helper did not mark the vlc:// registration as owned by Subtitle Bridge.'
          }
          $enabledCommand = (Get-Item -LiteralPath $vlcCommandKey).GetValue('')
          if ($enabledCommand -notlike '*Subtitle Bridge.exe*') {
            throw "Unexpected Stremio handoff command: $enabledCommand"
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $disableHandoff
          if ($LASTEXITCODE -ne 0) {
            throw 'Stremio handoff disable helper failed.'
          }
          $restoredName = (Get-Item -LiteralPath $vlcKey).GetValue('')
          $restoredCommand = (Get-Item -LiteralPath $vlcCommandKey).GetValue('')
          if ($restoredName -ne 'URL:CI VLC handler' -or $restoredCommand -ne '"C:\CI\vlc.exe" "%1"') {
            throw 'Stremio handoff disable helper did not restore the previous current-user vlc:// registration.'
          }

          New-Item -ItemType Directory -Path $handoffBackupDir -Force | Out-Null
          Set-Content -LiteralPath $handoffBackupPath -Value 'stale backup sentinel'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $enableHandoff -ExecutablePath (Join-Path $installDir 'Subtitle Bridge.exe')
          $staleBackupExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($staleBackupExitCode -eq 0) {
            throw 'Stremio handoff enable helper accepted a stale backup while another handler owned vlc://.'
          }
          $stillRestoredName = (Get-Item -LiteralPath $vlcKey).GetValue('')
          if ($stillRestoredName -ne 'URL:CI VLC handler') {
            throw 'Stale-backup protection modified the existing vlc:// handler.'
          }

          Remove-Item -LiteralPath $vlcKey -Recurse -Force
          Remove-Item -LiteralPath $handoffBackupDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Windows MVP artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-bridge-windows-mvp
          path: |
            release/SubtitleBridge-win-x64.zip
            release/SubtitleBridge-win-x64.zip.sha256
          if-no-files-found: error
