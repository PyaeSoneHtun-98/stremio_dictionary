name: macOS

env:
  SUBTITLE_BRIDGE_REPORT_ENDPOINT: ${{ vars.SUBTITLE_BRIDGE_REPORT_ENDPOINT || 'https://subtitle-report-service.vercel.app/api/report-dictionary' }}

on:
  pull_request:
  push:
    branches:
      - master
      - 'feat/issue-53-**'

permissions:
  contents: read

jobs:
  embed-spike:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [default, gpu-next-macvk, gpu-macvk, default-hwdec]
    env:
      SPIKE_OUT: ${{ github.workspace }}/spike-out
      SPIKE_CLIP: ${{ github.workspace }}/spike-out/clip.mp4
      SPIKE_PROBE: ${{ github.workspace }}/spike-out/window-probe
      SPIKE_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mpv and FFmpeg
        run: |
          brew install mpv ffmpeg
          mpv --version

      - name: Prepare clip and window probe
        run: |
          mkdir -p spike-out
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -t 60 -pix_fmt yuv420p spike-out/clip.mp4
          swiftc -O -o spike-out/window-probe scripts/macos-window-probe.swift

      - name: Embedded in window and resize
        if: ${{ !cancelled() }}
        env:
          SPIKE_PHASE: embed
        run: npx electron spike/macos-embed/main.cjs

      - name: Native fullscreen
        if: ${{ !cancelled() }}
        env:
          SPIKE_PHASE: fullscreen
        run: npx electron spike/macos-embed/main.cjs

      - name: Simple fullscreen
        if: ${{ !cancelled() }}
        env:
          SPIKE_PHASE: simplefullscreen
        run: npx electron spike/macos-embed/main.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-embed-spike-${{ matrix.variant }}
          path: spike-out/*.png
          if-no-files-found: warn

  package-macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project on macOS
        run: npm run check

      - name: Package macOS arm64 beta
        run: npm run package:mac

      - name: Verify app bundle
        run: |
          set -euo pipefail
          app="release/SubtitleBridge-macos-arm64/Subtitle Bridge.app"
          plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = "Subtitle Bridge"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "io.github.pyaesonehtun-98.subtitlebridge"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$(node -p "require('./package.json').version")"
          test -f "$app/Contents/Resources/subtitle-bridge.icns"
          test -f "$app/Contents/Resources/app/out/main/index.js"
          test ! -e "$app/Contents/Resources/default_app.asar"
          lipo -archs "$app/Contents/MacOS/Subtitle Bridge" | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          if find "$app" -iname 'mpv*' -o -iname 'ffmpeg' | grep .; then
            echo 'The macOS beta must not bundle mpv or FFmpeg.'
            exit 1
          fi
          hdiutil verify release/SubtitleBridge-macos-arm64.dmg
          (cd release && shasum -a 256 -c SubtitleBridge-macos-arm64.dmg.sha256)

      - name: Install mpv and FFmpeg
        run: brew install mpv ffmpeg

      - name: Smoke-test packaged playback
        run: |
          set -euo pipefail
          trap 'echo "::error title=smoke::failed at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p smoke
          swiftc -O -o smoke/window-probe scripts/macos-window-probe.swift
          cat > smoke/subs.srt <<'SRT'
          1
          00:00:00,500 --> 00:00:59,000
          I will look it up later
          SRT
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=1280x720:rate=25 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -i smoke/subs.srt -t 60 \
            -map 0:v -map 1:a -map 2:s -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s srt \
            -metadata:s:s:0 language=eng smoke/clip.mkv
          app="$PWD/release/SubtitleBridge-macos-arm64/Subtitle Bridge.app"
          log="$HOME/Library/Application Support/Subtitle Bridge/diagnostics/subtitle-bridge.log"
          "$app/Contents/MacOS/Subtitle Bridge" "$PWD/smoke/clip.mkv" > smoke/app-stdout.txt 2>&1 &
          app_pid=$!
          sleep 20
          screencapture -x smoke/player.png || true
          cat "$log"
          echo "::notice title=smoke events::$(grep -o '"event":"[^"]*"' "$log" | cut -d'"' -f4 | sort | uniq -c | tr -s ' \n' ' ')"
          echo "::notice title=smoke processes::$(pgrep -lf 'mpv|Subtitle Bridge' | cut -c1-60 | tr '\n' ';' || true)"

          kill -0 "$app_pid"
          mpv_pids="$(pgrep -x mpv)" || { echo 'mpv is not running.'; exit 1; }
          # shellcheck disable=SC2086 # one probe argument per PID
          mpv_windows="$(smoke/window-probe $mpv_pids)"
          echo "::notice title=smoke mpv windows::$mpv_windows"
          test "$mpv_windows" = '[]' || { echo 'mpv opened its own window instead of embedding.'; exit 1; }
          socket="$(find "${TMPDIR:-/tmp}" -path '*sb-mpv-*' -name 'mpv-*.sock' 2>/dev/null | head -1)"
          test -S "$socket" || { echo 'mpv IPC socket not found.'; exit 1; }
          osd="$(echo '{"command":["get_property","osd-dimensions"]}' | nc -U -w 2 "$socket" | grep '"osd-dimensions"\|"request_id"' || true)"
          echo "::notice title=smoke osd::$osd"
          echo "$osd" | grep -q '"w":[1-9]' || { echo 'mpv is not rendering into a sized surface.'; exit 1; }

          grep -q '"mpv.spawned"' "$log"
          grep -q '"source":"homebrew"' "$log"
          grep -q '"ffmpeg.extractComplete"' "$log" || { echo 'Homebrew FFmpeg did not extract the English subtitle track.'; exit 1; }
          if grep -q '"media.loadFailed"\|"mpv.spawnFailed"\|"media.externalLaunchRejected"\|"ffmpeg.extractFailed"' "$log" \
            || grep '"mpv.exit"' "$log" | grep -q '"expected":false'; then
            echo 'Packaged playback smoke test reported a failure.'
            exit 1
          fi

          kill "$app_pid"
          for _ in $(seq 1 20); do kill -0 "$app_pid" 2>/dev/null || break; sleep 0.5; done
          sleep 2
          if pgrep -x mpv; then
            echo 'mpv kept running after Subtitle Bridge quit.'
            exit 1
          fi

      - name: Upload macOS beta package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-bridge-macos-arm64
          path: |
            release/SubtitleBridge-macos-arm64.dmg
            release/SubtitleBridge-macos-arm64.dmg.sha256
            smoke/*.png
            smoke/app-stdout.txt
          if-no-files-found: warn
